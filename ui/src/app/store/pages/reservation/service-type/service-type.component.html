<div class="mt-3 w-full">
  @switch (services().state) {
    @case (state.LOADING) {
      <div
        class="rounded border border-surface-200 dark:border-surface-700 p-6 bg-surface-0 dark:bg-surface-900"
      >
        <ul class="m-0 p-0 list-none">
          <li class="mb-4">
            <div class="flex">
              <p-skeleton shape="circle" size="4rem" styleClass="mr-2" />
              <div class="self-center" style="flex: 1">
                <p-skeleton width="100%" styleClass="mb-2" />
                <p-skeleton width="75%" />
              </div>
            </div>
          </li>
          <li>
            <div class="flex">
              <p-skeleton shape="circle" size="4rem" styleClass="mr-2" />
              <div class="self-center" style="flex: 1">
                <p-skeleton width="100%" styleClass="mb-2" />
                <p-skeleton width="75%" />
              </div>
            </div>
          </li>
        </ul>
      </div>
    }
    @case (state.ERROR) {
      <p-message severity="error">{{ services().message }}</p-message>
    }
    @case (state.LOADED) {
      <div class="w-full pb-3">
        @for (s of services().data; track s.name) {
          <ul class="m-0 p-0 list-none">
            <li>
              <div class="flex">
                <p-skeleton shape="circle" size="4rem" styleClass="mr-2" />
                <div class="self-center" style="flex: 1">
                  <p-skeleton width="100%" styleClass="mb-2" />
                  <p-skeleton width="75%" />
                </div>
              </div>
            </li>
          </ul>
        }
      </div>
    }
  }
</div>

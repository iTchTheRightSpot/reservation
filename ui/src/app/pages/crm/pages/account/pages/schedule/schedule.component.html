<div class="card mt-3">
  <p-table
    #dt1
    selectionMode="single"
    dataKey="id"
    [loading]="models().state === state.LOADING"
    [value]="models().data || []"
    [paginator]="true"
    [first]="first"
    [rows]="rows"
    [tableStyle]="{ 'min-width': '50rem' }"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    (onPage)="
      emitter.next({
        date: date,
        page: (first = $event.first),
        size: (rows = $event.rows)
      })
    "
    [rowsPerPageOptions]="[5, 10, 20, 31]"
  >
    <ng-template #caption>
      <div class="flex items-center justify-between">
        <p-floatlabel variant="on">
          <p-date-picker
            (onSelect)="
              emitter.next({ date: $event, page: (first = 0), size: rows })
            "
            size="small"
            id="over_label"
            inputId="over_label"
            showIcon
            iconDisplay="input"
            view="month"
            dateFormat="mm/yy"
          />
          <label for="over_label">Date</label>
        </p-floatlabel>
        <p-button type="button" icon="pi pi-refresh" (click)="first = 0" text />
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        @for (h of thead; track h) {
          <th style="width: 25%">{{ h }}</th>
        }
      </tr>
    </ng-template>

    <ng-template #body let-model>
      <tr>
        <td>{{ fm(model.start) }}</td>
        <td>{{ fm(model.end) }}</td>
        <td>
          <p-badge
            [value]="model.is_visible"
            [severity]="model.is_visible ? 'success' : 'danger'"
          />
        </td>
        <td>
          <p-badge
            [value]="model.is_reoccurring"
            [severity]="model.is_reoccurring ? 'success' : 'danger'"
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<div class="w-full grid grid-cols-1 md:grid-cols-2 gap-2">
  <form class="w-full">
    form
  </form>

  <div class="w-full hidden md:block bg-red-600">
    @if (check(service1.reservationState()); as obj) {
      <app-summary
        [staffImage]="obj.staff.image_key"
        [staffName]="obj.staff.name"
        [bio]="obj.staff.bio"
        [services]="obj.services"
        [datetime]="service1.reservationState().dateTime"
      />
    }
  </div>
</div>

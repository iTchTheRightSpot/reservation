<svg class="fixed left-0 top-0 right-0 bottom-0 z-[-1]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  @if (service.isDarkMode()) {
    <rect fill="#000000" width="1600" height="900"/>
  } @else {
    <rect fill="#ffffff" width="1600" height="900"/>
  }
  <defs>
    <linearGradient id="a" x1="0" x2="0" y1="1" y2="0">
      <stop offset="0" stop-color="#0FF"/>
      <stop offset="1" stop-color="#CF6"/>
    </linearGradient>
    <linearGradient id="b" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#F00"/>
      <stop offset="1" stop-color="#FC0"/>
    </linearGradient>
  </defs>
  <g fill="#FFF" fill-opacity="0" stroke-miterlimit="10">
    <g stroke="url(#a)" stroke-width="2">
      <path transform="translate(0 0)" d="M1409 581 1450.35 511 1490 581z"/>
      <circle stroke-width="4" transform="rotate(0 800 450)" cx="500" cy="100" r="40"/>
      <path transform="translate(0 0)" d="M400.86 735.5h-83.73c0-23.12 18.74-41.87 41.87-41.87S400.86 712.38 400.86 735.5z"/>
    </g>
    <g stroke="url(#b)" stroke-width="4">
      <path transform="translate(0 0)" d="M149.8 345.2 118.4 389.8 149.8 434.4 181.2 389.8z"/>
      <rect stroke-width="8" transform="rotate(0 1089 759)" x="1039" y="709" width="100" height="100"/>
      <path transform="rotate(0 1400 132)" d="M1426.8 132.4 1405.7 168.8 1363.7 168.8 1342.7 132.4 1363.7 96 1405.7 96z"/>
    </g>
  </g>
</svg>

<div class="w-full p-5 flex flex-col gap-8">
  <div class="w-full flex gap-5 md:gap-1 flex-col md:flex-row items-center justify-center">
    <div class="w-full h-full gap-5 flex flex-col items-center justify-center md:order-none order-last">
      <p class="karla-font text-xl xl:text-2xl">WELCOME TO</p>
      <h1 class="font-bold xl:font-normal text-2xl xl:text-7xl">{{ name }}</h1>
      <p class="karla-font text-sm lg:text-lg xl:text-xl">{{ address }}</p>

      <div class="w-full flex gap-3 justify-center">
        <p-button (onClick)="toggleNewBookings = !toggleNewBookings; servicesEmitter.next(toggleNewBookings)" label="Book Now" severity="contrast" />
        <p-button (onClick)="about()" label="Contact Us" variant="outlined" severity="contrast" />
      </div>
      <a [href]="instagram" target="_blank">
        <span class="pi pi-instagram" style="font-size: 1.5rem"></span>
      </a>

    </div>

    <div class="w-full flex items-center justify-center md:order-none order-first">
      <p-image [src]="img" alt="welcome-image" styleClass="w-full h-full" />
    </div>
  </div>

  <div class="w-full">
    <p-carousel [value]="imgs" [numVisible]="3" [numScroll]="1" [responsiveOptions]="responsiveOptions" >
      <ng-template let-img #item>
        <div class="m-2">
          <p-image [src]="img" [alt]="img" width="250" height="250" />
        </div>
      </ng-template>
    </p-carousel>
  </div>

  <div class="w-full flex items-center justify-between">
    <img class="w-[8rem] h-[8rem] rounded-sm" [ngSrc]="logo" width="250" height="250" alt="logo">

    <a [href]="instagram" target="_blank">
      <span class="pi pi-instagram" style="font-size: 2rem"></span>
    </a>
  </div>
</div>

<p-drawer
  header="New Booking"
  [(visible)]="toggleNewBookings"
  position="left"
  styleClass="!w-full md:!w-[40rem] lg:!w-[50rem]"
>
  @defer (when toggleNewBookings) {
    <app-create-booking
      [services]="services()"
      [staffs]="staffsByServiceTypes()"
      [datesTimes]="validDates()"
      [submissionRequestState]="reserveBooking().state"
      (staffEmitter)="staffEmitter.next($event)"
      (datesEmitter)="validDatesEmitter.next($event)"
      (submitEmitter)="reserveBookingEmitter.next($event)"
    />
  } @loading {
    loading component...
  } @placeholder {
    loading component...
  }
</p-drawer>

name: Test & Deploy
on:
#  push:
#    branches:
#      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go version
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Log into DockerHub
        uses: docker/login-action@v3
        with:
          username: emmanuelu17
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start database
        run: |
          docker run --name pg \
          -p 5432:5432 \
          --expose 5432 \
          -e POSTGRES_DB=reservation_db \
          -e POSTGRES_USER=reservation \
          -e POSTGRES_PASSWORD=reservation \
          -d postgres:15.6

      - name: Env
        run: |
          openssl genrsa -out keys/private.key 2048
          openssl rsa -in keys/private.key -pubout -out keys/public.key

      - name: NPM install
        run: cd frontend/ && npm i && npm run build --verbose --configuration=production

      - name: Install dependencies
        run: go get .

      - name: Db migrations
        run: go run cmd/database/main.go

      - name: Tests
        run: go test -p 1 ./...

#      - name: Race test
#        run: go clean -testcache && go test ./... --race

      - name: Stop database
        run: docker stop pg

      - name: Build binary
        run: docker build --tag salon:latest . --progress=plain

      - name: Push to dockerhub
        run: |
          docker image tag salon:latest emmanuelu17/salon:latest
          docker push --all-tags emmanuelu17/salon
services:
  pg:
    image: postgres:15.6
    restart: always
    container_name: pg
    volumes:
      - pg-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: reservation_db
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
        - '5432:5432'
    expose:
      - 5432
    healthcheck:
      test: ['CMD', 'pg_isready']
      interval: 10s
      timeout: 5s
      retries: 5


services:
  res-pg:
    image: postgres:15.6
    restart: always
    container_name: res-pg
    volumes:
      - res-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: reservation_db
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
        - '5432:5432'
    expose:
      - 5432
    healthcheck:
      test: ['CMD', 'pg_isready']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  res-db-data:
